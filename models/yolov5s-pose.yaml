# YOLOv5s 人体关键点检测（姿态估计）模型配置
# 使用示例：python train.py --data coco-pose.yaml --weights '' --cfg yolov5s-pose.yaml --img 640
# 参考：https://github.com/ultralytics/yolov5

# 基础参数
nc: 1             # 类别数量（仅检测人）
nkpt: 17          # 关键点数量（COCO 17 个人体关键点）
depth_multiple: 0.33   # 模型深度缩放系数
width_multiple: 0.50   # 层通道缩放系数

# 锚框（针对 COCO 人体检测优化）
anchors:
  - [10, 13, 16, 30, 33, 23]    # P3/8   小目标锚框
  - [30, 61, 62, 45, 59, 119]   # P4/16  中目标锚框
  - [116, 90, 156, 198, 373, 326]  # P5/32  大目标锚框

# YOLOv5 v6.0 主干网络
backbone:
  # [from, number, module, args]
  [
    [-1, 1, Conv, [64, 6, 2, 2]],    # 0-P1/2
    [-1, 1, Conv, [128, 3, 2]],      # 1-P2/4
    [-1, 3, C3, [128]],
    [-1, 1, Conv, [256, 3, 2]],      # 3-P3/8
    [-1, 6, C3, [256]],
    [-1, 1, Conv, [512, 3, 2]],      # 5-P4/16
    [-1, 9, C3, [512]],
    [-1, 1, Conv, [1024, 3, 2]],     # 7-P5/32
    [-1, 3, C3, [1024]],
    [-1, 1, SPPF, [1024, 5]],        # 9
  ]

# YOLOv5 v6.0 检测头（使用 KeypointDetect 代替 Detect）
head: [
    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 6], 1, Concat, [1]],       # 拼接主干网络 P4
    [-1, 3, C3, [512, False]],       # 13

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, "nearest"]],
    [[-1, 4], 1, Concat, [1]],       # 拼接主干网络 P3
    [-1, 3, C3, [256, False]],       # 17 (P3/8-小目标)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 14], 1, Concat, [1]],      # 拼接检测头 P4
    [-1, 3, C3, [512, False]],       # 20 (P4/16-中目标)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 10], 1, Concat, [1]],      # 拼接检测头 P5
    [-1, 3, C3, [1024, False]],      # 23 (P5/32-大目标)

    # KeypointDetect 头：[nc, anchors, nkpt, input_channels]
    [[17, 20, 23], 1, KeypointDetect, [nc, anchors, nkpt]],  # 关键点检测(P3, P4, P5)
  ]
